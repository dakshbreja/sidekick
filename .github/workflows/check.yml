name: Verify clean foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
      - name: Build private instruction-only test package
        run: npm run package:plugin -- --output "$RUNNER_TEMP/school-bridge-community-plugin.zip"
      - name: Retain private test package
        uses: actions/upload-artifact@v4
        with:
          name: school-bridge-plugin-test-package
          path: ${{ runner.temp }}/school-bridge-community-plugin.zip
          retention-days: 7
      - name: Locate installed Chromium browser
        run: |
          browser_executable=$(command -v chromium || command -v google-chrome || command -v chromium-browser) || {
            echo 'Rendered QA requires an installed Chromium or Google Chrome executable.'
            exit 1
          }
          echo "BROWSER_EXECUTABLE=$browser_executable" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/school-bridge-config"
      - name: Rendered synthetic onboarding and recovery
        run: npm run test:browser
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
          XDG_CONFIG_HOME: ${{ runner.temp }}/school-bridge-config
          BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/school-bridge-browser-evidence
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          path: ${{ runner.temp }}/school-bridge-browser-evidence
          if-no-files-found: ignore
          retention-days: 7
